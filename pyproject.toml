[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-gummy-worm"
version = "4.0.0"
description = "Felicific signatures: a mergeable measure of sentiment in hedons and dolors"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy"]

[project.optional-dependencies]
refine = ["scipy", "scikit-learn"]
mcp = ["mcp"]

[tool.setuptools]
packages = ["sgw"]

[tool.setuptools.package-data]
sgw = ["*.tsv", "*.json"]
