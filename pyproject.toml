[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgw"
version = "3.5.0"
description = "Sentiment Gummy Worm — unsupervised mathematical sentiment scoring engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "gensim>=4.3.0",
    "spacy>=3.5.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.1",
    "vaderSentiment>=3.3.2",
]

[tool.setuptools.packages.find]
include = ["sgw*"]
