# SGW V3 Configuration
# All tunable parameters are defined here. Code must read from this file.
# DO NOT hardcode any of these values in source code.

decay:
  lambda_default: 1.0  # Will be calibrated in Tier 3. This is a placeholder.
  lambda_search_range: [0.1, 0.2, 0.3, 0.5, 0.7, 1.0, 1.5, 2.0, 2.5, 3.0]

dilution:
  k_default: 2.0  # Will be calibrated in Tier 3. This is a placeholder.
  k_search_range: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0]

normalization:
  power: 0.8

valence:
  positive_seeds:
    - "excellent"
    - "wonderful"
    - "fantastic"
    - "amazing"
    - "outstanding"
    - "superb"
    - "brilliant"
    - "magnificent"
    - "exceptional"
    - "terrific"
    - "joyful"
    - "delightful"
    - "love"
    - "happy"
    - "pleased"
    - "grateful"
    - "cheerful"
    - "excited"
    - "thrilled"
    - "ecstatic"
  negative_seeds:
    - "terrible"
    - "horrible"
    - "awful"
    - "dreadful"
    - "atrocious"
    - "abysmal"
    - "appalling"
    - "disgusting"
    - "revolting"
    - "miserable"
    - "agonizing"
    - "devastating"
    - "hate"
    - "sad"
    - "angry"
    - "furious"
    - "depressed"
    - "heartbroken"
    - "wretched"
    - "despair"
  fallback_valence: 0.0  # Return this if word is OOV
  valence_threshold_factor: 0.85  # Ignore valence projections below this factor of sigma_v_aff
  valence_overrides:
    experience: 0.0
    service: 0.0
    data: 0.0
    product: 0.0
    item: 0.0
    purchase: 0.0
    order: 0.0
    delivery: 0.0
    shipping: 0.0
    active: 0.0
    located: 0.0
    material: 0.0
    object: 0.0
    entity: 0.0
    exists: 0.0
    process: 0.0
    inert: 0.0
    substance: 0.0
    coordinates: 0.0
    was: 0.0
    is: 0.0
    it: 0.0
    the: 0.0
    a: 0.0
    at: 0.0
    and: 0.0
    in: 0.0
    on: 0.0

syntax:
  buffer_pos_tags:
    - "DET"
    - "ADP"
    - "CCONJ"
    - "SCONJ"
    - "PART"
    - "PRON"
    - "PUNCT"
    - "SPACE"
    - "X"
    - "SYM"
    - "NUM"
  emotion_pos_tags:
    - "ADJ"
    - "ADV"
    - "VERB"
    - "INTJ"
    - "NOUN"

modifiers:
  intensifiers:
    "very": 1.5
    "extremely": 2.0
    "incredibly": 1.8
    "absolutely": 1.9
    "utterly": 1.8
    "completely": 1.7
    "totally": 1.6
    "really": 1.3
    "so": 1.3
    "quite": 1.2
  mitigators:
    "slightly": 0.5
    "somewhat": 0.6
    "fairly": 0.7
    "rather": 0.8
    "a bit": 0.6
    "a little": 0.5
    "barely": 0.3
    "hardly": 0.3
    "kind of": 0.6
    "sort of": 0.6

sarcasm:
  incongruity_threshold: 0.75  # Will be calibrated. Placeholder.
  inversion_multiplier: -0.5
  enabled: false  # Disabled by default. Only enable after separate validation.

processing:
  max_text_length: 10000  # Characters. Truncate beyond this.
  min_text_length: 3  # Characters. Return 0.0 below this.
  spacy_batch_size: 256
  spacy_model: "en_core_web_sm"

evaluation:
  goemotions_test_fraction: 0.2
  random_seed: 42
